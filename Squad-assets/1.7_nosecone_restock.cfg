// this patch lets you use the deprecated rocketNoseCone_v2 with it's stock textures in a Restock install

@PART[rocketNoseCone_v2]:NEEDS[Restock]:FIRST
{
	%RestockIgnore = True
}

@PART[rocketNoseCone_v2]:LAST[Restock]
{
	@MODULE[ModulePartVariants]
	{
		@VARIANT[White]
		{
			@TEXTURE
			{
				@mainTextureURL = OldPartsRevived/Squad-assets/Parts/Utility/rockomaxAdapters/Assets/Rockomax_Adapters_diffuse_W
				@_BumpMap = OldPartsRevived/Squad-assets/Parts/Utility/rockomaxAdapters/Assets/Rockomax_Adapters_normal
			}
		}
		@VARIANT[BlackAndWhite]
		{
			@TEXTURE
			{
				@mainTextureURL = OldPartsRevived/Squad-assets/Parts/Utility/rockomaxAdapters/Assets/Rockomax_Adapters_diffuse
				@_BumpMap = OldPartsRevived/Squad-assets/Parts/Utility/rockomaxAdapters/Assets/Rockomax_Adapters_normal
			}
		}
		@VARIANT[Orange]
		{
			@TEXTURE
			{
				@mainTextureURL = OldPartsRevived/Squad-assets/Parts/Aero/cones/Assets/rocketNoseCones_O
				@_BumpMap = OldPartsRevived/Squad-assets/Parts/Aero/cones/Assets/rocketNoseCones_O_Normal
			}
		}
	}
}